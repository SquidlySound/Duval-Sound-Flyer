name: Update flyers.json

on:
  push:
    paths:
      - 'flyers/**'

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for git log dates

      - name: AI-name new flyers from date and lineup
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_FOLDER: flyers
          # Haiku is the cheapest model and handles clean flyer text fine.
          # If it starts misreading stylised lineups, override without editing
          # this file: repo Settings > Secrets and variables > Actions >
          # Variables > new variable AI_MODEL = claude-sonnet-5
          AI_MODEL: ${{ vars.AI_MODEL || 'claude-haiku-4-5-20251001' }}
        run: |
          cat > /tmp/ai_rename.py << 'AIEOF'
          #!/usr/bin/env python3
          """
          Reads event flyers with Claude's vision API and renames them
            YYYY-MM-DD_dj-one-dj-two.ext
          using the date and performer names printed on the flyer.

          Fail-safe by design: no API key, an API error, a video file, or an unreadable
          flyer all just leave the file alone for the normal sanitize step to handle.
          Never blocks the workflow.
          """
          import os, re, json, base64, subprocess, sys, urllib.request, urllib.error
          from datetime import date

          FOLDER   = os.environ.get("AI_FOLDER", "flyers")
          API_KEY  = os.environ.get("ANTHROPIC_API_KEY", "").strip()
          MODEL    = os.environ.get("AI_MODEL", "claude-sonnet-5")
          IMAGE_EXT = {".png": "image/png", ".jpg": "image/jpeg", ".jpeg": "image/jpeg",
                       ".gif": "image/gif", ".webp": "image/webp"}
          MAX_BYTES = 4 * 1024 * 1024   # skip very large images; API has request limits

          PROMPT = (
              "This is a flyer for a music event. Today's date is {today}.\n\n"
              "Extract two things:\n"
              "1. The date of the event. If the year is not printed, infer the most likely "
              "year based on today's date (events are usually upcoming, not in the past).\n"
              "2. The names of the performers, DJs, or artists billed on the flyer. "
              "Ignore venue names, promoter names, sponsors, and ticket vendors.\n\n"
              "Respond with ONLY valid JSON and nothing else:\n"
              '{{"date": "YYYY-MM-DD", "performers": ["name one", "name two"]}}\n\n'
              'If you cannot determine the date with reasonable confidence, use null for it. '
              'If no performers are legible, use an empty array.'
          )

          def slug(text):
              t = text.lower()
              t = re.sub(r"[\s_]+", "-", t)
              t = re.sub(r"[^a-z0-9\-]", "", t)
              t = re.sub(r"-{2,}", "-", t)
              return t.strip("-")

          def ask_claude(img_bytes, media_type):
              body = json.dumps({
                  "model": MODEL,
                  "max_tokens": 400,
                  "messages": [{
                      "role": "user",
                      "content": [
                          {"type": "image", "source": {
                              "type": "base64", "media_type": media_type,
                              "data": base64.b64encode(img_bytes).decode()}},
                          {"type": "text", "text": PROMPT.format(today=date.today().isoformat())},
                      ],
                  }],
              }).encode()

              req = urllib.request.Request(
                  "https://api.anthropic.com/v1/messages",
                  data=body,
                  headers={"content-type": "application/json",
                           "x-api-key": API_KEY,
                           "anthropic-version": "2023-06-01"},
              )
              with urllib.request.urlopen(req, timeout=90) as r:
                  data = json.loads(r.read().decode())

              text = "".join(b.get("text", "") for b in data.get("content", [])
                             if b.get("type") == "text").strip()
              text = re.sub(r"^```(?:json)?|```$", "", text, flags=re.M).strip()
              return json.loads(text)

          def build_name(info, ext):
              d = info.get("date")
              if d and not re.match(r"^\d{4}-\d{2}-\d{2}$", str(d)):
                  d = None
              performers = [slug(p) for p in (info.get("performers") or []) if slug(p)]
              performers = performers[:4]           # keep filenames sane
              stem = "-".join(performers) if performers else "event"
              stem = stem[:70]
              return (d + "_" + stem + ext) if d else None

          def main():
              if not API_KEY:
                  print("No ANTHROPIC_API_KEY set - skipping AI naming")
                  return
              if not os.path.isdir(FOLDER):
                  return

              used = set(os.listdir(FOLDER))
              for fname in sorted(os.listdir(FOLDER)):
                  ext = os.path.splitext(fname)[1].lower()
                  if ext == ".jpeg":
                      ext = ".jpg"
                  if ext not in IMAGE_EXT:
                      continue                                   # videos etc - skip
                  if re.match(r"^\d{4}-\d{2}-\d{2}_", fname):
                      continue                                   # already named - skip
                  path = os.path.join(FOLDER, fname)
                  if os.path.getsize(path) > MAX_BYTES:
                      print("Skip (too large for API): " + fname)
                      continue

                  try:
                      info = ask_claude(open(path, "rb").read(), IMAGE_EXT[ext])
                  except Exception as e:
                      print("AI read failed for " + fname + ": " + str(e)[:160])
                      continue

                  newname = build_name(info, ext)
                  if not newname:
                      print("No confident date for " + fname + " - leaving as is")
                      continue
                  if newname == fname or newname in used:
                      b, e = os.path.splitext(newname)
                      i = 2
                      while (b + "-" + str(i) + e) in used:
                          i += 1
                      newname = b + "-" + str(i) + e

                  try:
                      subprocess.run(["git", "mv", path, os.path.join(FOLDER, newname)], check=True)
                      used.discard(fname); used.add(newname)
                      print("AI renamed: " + fname + "  ->  " + newname
                            + "   (performers: " + ", ".join(info.get("performers") or []) + ")")
                  except subprocess.CalledProcessError as e:
                      print("git mv failed for " + fname + ": " + str(e))

          if __name__ == "__main__":
              main()

          AIEOF
          python3 /tmp/ai_rename.py

      - name: Sanitize filenames and regenerate flyers.json
        run: |
          python3 << 'PYEOF'
          import os, re, json, subprocess

          FOLDER    = 'flyers'
          MANIFEST  = 'flyers.json'
          SUPPORTED = {'.png', '.jpg', '.jpeg', '.gif', '.webp', '.mp4', '.webm', '.mov'}

          def sanitize(name):
              base, ext = os.path.splitext(name)
              ext = ext.lower()
              if ext == '.jpeg':
                  ext = '.jpg'

              # Preserve a leading YYYY-MM-DD prefix if you added one manually
              date_prefix = ''
              m = re.match(r'^(\d{4}-\d{2}-\d{2})[_\-\s]*(.*)$', base)
              if m:
                  date_prefix = m.group(1) + '_'
                  base = m.group(2)

              base = base.lower()
              base = re.sub(r'[\s_]+', '-', base)       # spaces/underscores -> hyphen
              base = re.sub(r'[^a-z0-9\-]', '', base)   # strip everything else
              base = re.sub(r'-{2,}', '-', base)        # collapse repeats
              base = base.strip('-')
              if not base:
                  base = 'flyer'
              return date_prefix + base + ext

          if not os.path.isdir(FOLDER):
              with open(MANIFEST, 'w') as out:
                  json.dump([], out, indent=2)
              print('No ' + FOLDER + '/ folder - wrote empty manifest')
              raise SystemExit(0)

          # ---- PASS 1: rename anything with a messy filename ----
          # git mv preserves binary content exactly, unlike renaming in the
          # GitHub web editor (which corrupts images).
          existing = [f for f in os.listdir(FOLDER)
                      if os.path.splitext(f)[1].lower() in SUPPORTED]
          used = set()
          renames = 0
          # Maps new name -> original name, so PASS 2 can still look up git
          # history (the rename isn't committed yet, so the new path has none)
          original_of = {}

          # Reserve names that are already clean so we don't collide with them
          for f in existing:
              if sanitize(f) == f:
                  used.add(f)

          for f in sorted(existing):
              clean = sanitize(f)
              if clean == f:
                  continue
              # Resolve collisions by appending -2, -3, ...
              if clean in used:
                  b, e = os.path.splitext(clean)
                  i = 2
                  while (b + '-' + str(i) + e) in used:
                      i += 1
                  clean = b + '-' + str(i) + e
              used.add(clean)
              original_of[clean] = f
              subprocess.run(['git', 'mv', os.path.join(FOLDER, f),
                                           os.path.join(FOLDER, clean)], check=True)
              print('Renamed: ' + f + '  ->  ' + clean)
              renames += 1

          if renames == 0:
              print('All filenames already clean')

          # ---- PASS 2: build the manifest, newest first ----
          # A YYYY-MM-DD filename prefix (the event date) wins if present.
          # Otherwise falls back to when the file was first committed.
          files = [f for f in os.listdir(FOLDER)
                   if os.path.splitext(f)[1].lower() in SUPPORTED]

          def sort_key(fname):
              m = re.match(r'^(\d{4}-\d{2}-\d{2})', fname)
              if m:
                  return m.group(1) + 'T23:59:59+00:00'
              # Look up history under the pre-rename name if we just renamed it
              lookup = original_of.get(fname, fname)
              r = subprocess.run(
                  ['git', 'log', '--follow', '--format=%aI', '--',
                   os.path.join(FOLDER, lookup)],
                  capture_output=True, text=True)
              dates = [d for d in r.stdout.strip().split('\n') if d]
              if dates:
                  return dates[-1]
              # Brand new file with no committed history yet - treat as "now"
              return subprocess.run(['date', '-u', '+%Y-%m-%dT%H:%M:%S+00:00'],
                                    capture_output=True, text=True).stdout.strip()

          files.sort(key=sort_key, reverse=True)

          with open(MANIFEST, 'w') as out:
              json.dump(files, out, indent=2)

          print('')
          print('Generated ' + MANIFEST + ' (' + str(len(files)) + ' files, newest first):')
          for f in files:
              print('  ' + f)
          PYEOF

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A flyers flyers.json
          git diff --staged --quiet || git commit -m "Auto: sanitize flyer filenames + update flyers.json"
          git push
